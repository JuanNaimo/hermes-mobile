<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#041c1c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Hermes Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app fails to boot, show why instead of an empty dark page.
      (function () {
        function show(msg) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount) return;
          root.innerHTML =
            '<div style="font:15px/1.5 system-ui,sans-serif;color:#ffe6cb;background:#041c1c;padding:24px;height:100%;box-sizing:border-box;overflow:auto">' +
            '<p style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Hermes Mobile no pudo iniciar</p>' +
            '<pre style="white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;opacity:.85"></pre>' +
            "<p>Probá borrar <code>node_modules</code> y correr <code>pnpm install</code> de nuevo, y revisá la terminal donde corre <code>pnpm dev</code>.</p></div>";
          root.querySelector("pre").textContent = msg;
        }
        window.addEventListener("error", function (e) { show(String(e.message || e.error || e)); });
        window.addEventListener("unhandledrejection", function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
